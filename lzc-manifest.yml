application:
  subdomain: piclite
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://piclite:3456/
services:
  piclite:
    # ghcr.io/amiaoapp/piclite:2.0.0
    # upstream: ghcr.io/amiaoapp/piclite:2.0.0
    image: ghcr.1ms.run/amiaoapp/piclite:2.0.0
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3456
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3456/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
