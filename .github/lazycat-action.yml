version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/piclite.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: piclite

images:
  - id: piclite
    target: service
    service: piclite
    source: ghcr.io/amiaoapp/piclite
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      image_template: 'ghcr.1ms.run/amiaoapp/piclite:{tag}'
    require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: PicLite 图轻
    summary: 镜像加速模式自动跟上游 GHCR 版本发布的图片压缩工具
